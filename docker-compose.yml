version: '3.8'

services:
  situation-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FINNHUB_API_KEY: ${VITE_FINNHUB_API_KEY:-}
        VITE_FRED_API_KEY: ${VITE_FRED_API_KEY:-}
    container_name: situation-monitor
    ports:
      - "3003:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_FINNHUB_API_KEY=${VITE_FINNHUB_API_KEY:-}
      - VITE_FRED_API_KEY=${VITE_FRED_API_KEY:-}
      - MARKETSTACK_API_KEY=${MARKETSTACK_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.docker.compose.project=situation-monitor"
      - "description=Real-time global intelligence dashboard"
